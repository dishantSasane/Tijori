# Market profiles. Everything that differs by market lives here, not in code.
# Copy to config/markets.yaml (git-ignored). Details and sources: docs/MARKETS.md.
# Cost numbers are PLACEHOLDERS to be confirmed against the chosen broker's current charges.

india_equity:
  calendar: XNSE                       # exchange_calendars id
  timezone: Asia/Kolkata
  session: {open: "09:15", close: "15:30"}
  intraday_square_off: "15:15"         # for intraday (MIS-style) strategies
  tier_a_universe: nifty50_plus_next50
  tier_b:
    enabled: false
    source: nse_bhavcopy
    filters: {series: [EQ], min_price_inr: 20, min_avg_daily_value_inr: 50000000, exclude_surveillance: true}
  data:
    live_provider: TBD                 # free: Angel One SmartAPI / Fyers; paid: Kite Connect Rs 500/mo
    history_provider: TBD
  costs:                               # placeholders
    brokerage_per_order_inr: 20
    slippage_bps: 5
    stt_and_charges: TODO_confirm_with_broker_contract_note

us_equity:
  calendar: XNYS
  timezone: America/New_York
  session: {open: "09:30", close: "16:00"}
  tier_a_universe: nasdaq100
  data: {provider: alpaca_free_iex}
  costs: {commission_per_order_usd: 0, slippage_bps: 5, fx_and_remittance_note: TODO}

crypto:
  calendar: 24x7
  timezone: UTC
  daily_cutoff_utc: "00:00"            # defines the "daily candle" close
  tier_a_universe: [BTC, ETH, top_20_by_volume]
  data: {provider: ccxt_public}
  costs: {taker_fee_bps: 10, slippage_bps: 10}

commodities_mcx:
  calendar: XMCX_or_custom
  timezone: Asia/Kolkata
  session_note: "approx 09:00 to 23:30/23:55 IST depending on commodity; verify per instrument"
  data: {provider: same_as_india_equity}
  costs: {brokerage_per_order_inr: 20, slippage_bps: 8}

nse_currency:
  calendar: XNSE
  timezone: Asia/Kolkata
  session: {open: "09:00", close: "17:00"}   # differs from equity 09:15-15:30, see storage/nse_currency_universe.py
  data: {provider: same_as_india_equity}
  costs: {brokerage_per_order_inr: 20, slippage_bps: 6}

memecoin:
  calendar: 24x7
  data: {provider: dex_aggregator_TBD}  # e.g. a public DEX data API; verify terms
  costs: {slippage_bps: 100, network_fee_note: TODO}   # paper fills must be pessimistic
  extra_checks: [min_pool_liquidity_usd, token_safety_checks, max_position_pct_of_pool]
