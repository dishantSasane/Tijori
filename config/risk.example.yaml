# PROPOSED DEFAULTS. The owner must confirm every number before any live mode.
# Copy to config/risk.yaml (git-ignored). See docs/RISK_SPEC.md for meaning.

global:
  mode: paper                      # paper | approval | auto  (sleeves can be stricter, never looser)
  paper_capital_inr: 1000000       # OPEN QUESTION for owner; placeholder only
  max_portfolio_drawdown_pct: 10   # from equity peak -> kill switch: halt, alert, keep stops
  max_daily_loss_pct: 2            # of total equity -> no new entries for the rest of the day
  max_open_positions_total: 15
  stale_data_seconds: 30           # intraday feed older than this -> no new entries
  order_price_band_pct: 5          # reject orders more than this far from last price (fat finger)

sleeves:                           # allocations are illustrative; owner decides
  india_equity:   {enabled: true,  allocation_pct: 40, risk_per_trade_pct: 0.5, max_positions: 6, mode: paper}
  us_equity:      {enabled: false, allocation_pct: 20, risk_per_trade_pct: 0.5, max_positions: 4, mode: paper}
  crypto:         {enabled: false, allocation_pct: 25, risk_per_trade_pct: 0.5, max_positions: 4, mode: paper}
  commodities:    {enabled: false, allocation_pct: 10, risk_per_trade_pct: 0.5, max_positions: 2, mode: paper}
  memecoin:       {enabled: false, allocation_pct: 5,  risk_per_trade_pct: 0.25, max_positions: 3, mode: paper}

strategy_instance_defaults:
  pause_after_consecutive_losses: 5
  pause_if_live_drawdown_exceeds_backtest_max_by_pct: 25
